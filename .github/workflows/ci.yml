name: tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Lightweight tests only: no GEO downloads, no pyaging/torch.
      - run: pip install numpy pandas scipy pytest
      - run: pytest -q
